# T-cell maturation subtree (broad-level + thymic).
# Source: data/DAG_editable.pptx slide 3 "T cell maturation"
# (user-curated). 20 nodes, 13 connector-derived edges, parsed by
# DCTA phase-2.5 build step. Extra implicit edges (Pro-T -> DN -> DP ->
# Naive_T -> {Naive_CD4_T, Naive_CD8_T, T_gd, NKT}) added to glue the
# subtree to the BM broad prior at T_cell_progenitor (= "Pro-T").
#
# Merged with dag_prior_bm.yaml via dcta.prior at load time.

nodes:
  # Thymic precursors (added so the subtree connects to BM prior)
  - DN              # double negative thymocyte
  - DP              # double positive thymocyte (CD4/CD8 split point)
  - T_gd            # gamma-delta T
  - NKT_cell
  # Naive T (peripheral output of thymus — split at DP per user directive)
  - Naive_CD4_T_cell
  - Naive_CD8_T_cell
  - CD4_naive
  - CD8_naive
  # CD4 helper subsets
  - Th1
  - Th2
  - Th17
  - Tfh
  - Treg
  # CD8 memory / effector
  - CD8_Treg
  - CD4_central_memory
  - CD8_central_memory
  - CD4_effector_memory
  - CD8_effector_memory
  - CD8_effector

edges:
  # Connection to BM broad prior (Pro-T = T_cell_progenitor in BM yaml)
  - [T_cell_progenitor, DN]
  - [DN, DP]
  - [DN, T_gd]
  # CD4/CD8 split happens at DP (per spec 2026-05-21):
  # DP thymocytes are committed to TCR αβ T cells; here we directly
  # branch into Naive_CD4 / Naive_CD8 / NKT — Naive_T_cell intermediate
  # is no longer used (alias-only, see lineage_mature_markers.yaml).
  - [DP, Naive_CD4_T_cell]
  - [DP, Naive_CD8_T_cell]
  - [DP, NKT_cell]
  # ---- pptx slide 3 connector-derived edges ----
  - [Naive_CD4_T_cell, CD4_naive]
  - [Naive_CD4_T_cell, Th1]
  - [Naive_CD4_T_cell, Th2]
  - [Naive_CD4_T_cell, Th17]
  - [Naive_CD4_T_cell, Tfh]
  - [Naive_CD4_T_cell, Treg]
  - [CD4_naive, CD4_central_memory]
  - [CD4_central_memory, CD4_effector_memory]
  - [Naive_CD8_T_cell, CD8_naive]
  - [CD8_naive, CD8_central_memory]
  - [CD8_central_memory, CD8_effector_memory]
  - [CD8_effector_memory, CD8_effector]
  # Slide-3 missing-but-implied: CD8 also gives rise to CD8_Treg
  - [CD8_naive, CD8_Treg]
