# T-cell maturation subtree (broad-level + thymic).
# Source: data/DAG_editable.pptx slide 3 "T cell maturation"
# (user-curated). 20 nodes, 13 connector-derived edges, parsed by
# DCTA phase-2.5 build step. Extra implicit edges (Pro-T -> DN -> DP ->
# Naive_T -> {Naive_CD4_T, Naive_CD8_T, T_gd, NKT}) added to glue the
# subtree to the BM broad prior at T_cell_progenitor (= "Pro-T").
#
# Merged with dag_prior_bm.yaml via dcta.prior at load time.

nodes:
  # Thymic precursors
  - DN                # double negative thymocyte (CD4-CD8-)
  - DP                # double positive thymocyte (CD4+CD8+)
  - T_gd              # gamma-delta T (diverges at DN)
  # Phase 2.9 Option B: Single-Positive (SP) thymic stage added between
  # DP and peripheral Naive T. Treg also gets two-source path: thymic
  # nTreg (Treg_thymic) directly from DP, and peripheral iTreg from
  # Naive_CD4_T_cell.
  - CD4_SP            # CD4+CD8- single positive thymocyte
  - CD8_SP            # CD4-CD8+ single positive thymocyte
  - Treg_thymic       # natural Treg (nTreg), thymic origin
  - NKT_cell
  # Peripheral mature T
  - Naive_CD4_T_cell
  - Naive_CD8_T_cell
  # NOTE: CD4_naive/CD8_naive intermediate nodes were merged into
  # Naive_CD4_T_cell / Naive_CD8_T_cell respectively (2026-05-21).
  # Their aliases are kept on the parent entries in lineage_mature_markers.yaml.
  # CD4 helper subsets
  - Th1
  - Th2
  - Th17
  - Tfh
  - Treg               # peripheral induced Treg (iTreg)
  # CD8 memory / effector
  - CD8_Treg
  - CD4_central_memory
  - CD8_central_memory
  - CD4_effector_memory
  - CD8_effector_memory
  - CD8_effector

edges:
  # Connection to BM broad prior (Pro-T = T_cell_progenitor in BM yaml)
  - [T_cell_progenitor, DN]
  - [DN, DP]
  - [DN, T_gd]
  # DP -> SP / NKT / nTreg branching at single-positive stage.
  # CD4/CD8 lineage commitment happens at DP via ThPOK (CD4) vs RUNX3
  # (CD8) bistable switch (Ellmeier 2013 Nat Rev Immunol; Egawa &
  # Littman 2008 Nat Immunol). nTreg branches at the same stage by
  # high-affinity self-pMHC selection + FOXP3 induction (Sakaguchi 2008
  # Cell; Thornton et al. 2010 J Immunol — Helios discriminates nTreg).
  # iNKT branches via CD1d-lipid selection at DP (Bendelac et al. 2007
  # Annu Rev Immunol).
  - [DP, CD4_SP]
  - [DP, CD8_SP]
  - [DP, Treg_thymic]
  - [DP, NKT_cell]
  # Thymic SP -> peripheral naive T (thymic export)
  - [CD4_SP, Naive_CD4_T_cell]
  - [CD8_SP, Naive_CD8_T_cell]
  # ---- pptx slide 3 connector-derived edges (CD4_naive/CD8_naive
  # merged into Naive_CD4_T_cell/Naive_CD8_T_cell, so edges that used
  # to pass through them are rewired to skip the intermediate node) ----
  - [Naive_CD4_T_cell, Th1]
  - [Naive_CD4_T_cell, Th2]
  - [Naive_CD4_T_cell, Th17]
  - [Naive_CD4_T_cell, Tfh]
  - [Naive_CD4_T_cell, Treg]
  - [Naive_CD4_T_cell, CD4_central_memory]
  - [CD4_central_memory, CD4_effector_memory]
  - [Naive_CD8_T_cell, CD8_central_memory]
  - [CD8_central_memory, CD8_effector_memory]
  - [CD8_effector_memory, CD8_effector]
  # CD8 -> CD8_Treg (slide-3 missing-but-implied; was via CD8_naive)
  - [Naive_CD8_T_cell, CD8_Treg]
